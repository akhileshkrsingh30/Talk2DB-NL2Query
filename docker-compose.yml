services:
  api:
    build: .
    container_name: nl2query-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - MEM0_PG_CONNECTION_STRING=postgresql://postgres:postgres@pgvector:5432/postgres
    volumes:
      - ./shared_results:/app/shared_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - pgvector

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: mem0-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
    restart: unless-stopped
    depends_on:
      - prometheus


  loki:
    image: grafana/loki:latest
    container_name: monitoring-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    restart: unless-stopped
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: monitoring-snmp-exporter
    ports:
      - "9116:9116"
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    container_name: monitoring-telegraf
    ports:
      - "162:162/udp"
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped
    depends_on:
      - loki

volumes:
  pgvector_data:
  grafana_data:
  loki_data:



