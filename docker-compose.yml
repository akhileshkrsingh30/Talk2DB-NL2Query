services:
  api:
    build: .
    container_name: nl2query-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/
      - MEM0_PG_CONNECTION_STRING=postgresql://postgres:postgres@pgvector:5432/postgres
    volumes:
      - ./shared_results:/app/shared_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - pgvector

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: mem0-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgvector_data:
