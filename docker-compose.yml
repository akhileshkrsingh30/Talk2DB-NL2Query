services:
  api:
    build: .
    container_name: nl2query-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/
    volumes:
      - ./shared_results:/app/shared_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

