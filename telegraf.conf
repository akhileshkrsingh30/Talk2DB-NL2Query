[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false

# Receive SNMP Traps
[[inputs.snmp_trap]]
  ## Address and port to listen on for UDP SNMP trap packets.
  service_address = "udp://:162"

# Forward Traps as Logs to Loki
[[outputs.loki]]
  url = "http://loki:3100/loki/api/v1/push"
  
  # Configure labels so they can be easily filtered in Grafana
  [outputs.loki.labels]
    job = "snmp-traps"
    source = "telegraf"
